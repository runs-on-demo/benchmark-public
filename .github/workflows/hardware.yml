name: Runner hardware

on:
  # Staggered so suites never share a provider's concurrency (burst runs alone,
  # mid-week, at a busy hour). Schedules only fire on the default branch.
  schedule:
    - cron: "0 3 * * 2"
  workflow_dispatch:
    inputs:
      runners:
        description: "default (the suite's runners; also when empty), all, or comma-separated runner ids from config/runners.json"
        required: false
        default: ""
      arch:
        description: "all, x64 or arm64 (empty: all). Trigger files are read on push only"
        required: false
        default: ""
      iterations:
        description: "Runs per runner, at most 5 (empty: 1)"
        required: false
        default: ""
  workflow_call:
    inputs:
      suite:
        type: string
        default: hardware
      runners:
        type: string
        default: ""
      arch:
        type: string
        default: ""
      iterations:
        type: string
        default: ""
      # Comma-separated hw-bench.py groups to run (e.g. "cpu,passmark" for
      # ec2-cpu). Empty: every group, as the hardware suite runs.
      groups:
        type: string
        default: ""
    secrets:
      SITE_DISPATCH_TOKEN:
        required: false
  push:
    branches: [main, harness]
    paths:
      - triggers/hardware.json

permissions:
  contents: read


jobs:
  plan:
    # The first push of a new branch matches every paths filter: never a run.
    if: github.event_name != 'push' || github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.plan.outputs.run }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: plan
        # Inputs go through env, never into the script text.
        env:
          SUITE: ${{ inputs.suite || 'hardware' }}
          RUNNERS: ${{ inputs.runners }}
          ARCH: ${{ inputs.arch }}
          ITERATIONS: ${{ inputs.iterations }}
          EVENT: ${{ github.event_name }}
          PRIVATE: ${{ github.event.repository.private }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$PRIVATE" ] || PRIVATE=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)
          python3 bin/plan.py --suite "$SUITE" \
            --runners "$RUNNERS" --arch "$ARCH" --iterations "$ITERATIONS" \
            --trigger "triggers/$SUITE.json" --event "$EVENT" \
            --private "$PRIVATE" --out plan.json
      - if: steps.plan.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plan
          path: plan.json

  bench:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    name: ${{ matrix.key }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.label }}
    timeout-minutes: 45
    env:
      # Wrapped in commas so a step can test ",<group>," without prefix matches.
      BENCH_GROUPS: ",${{ inputs.groups || 'cpu,passmark,memory,disk,network,docker,postgres' }},"
    steps:
      - id: harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: .harness
          persist-credentials: false
      - name: Host info
        uses: ./.harness/.github/actions/bench-start
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sysbench fio p7zip-full postgresql-client unzip
      - name: "cpu"
        if: contains(env.BENCH_GROUPS, ',cpu,')
        continue-on-error: true
        run: python3 .harness/bin/hw-bench.py cpu --out "$RUNNER_TEMP/bench/metrics.json"
      - name: "passmark"
        if: contains(env.BENCH_GROUPS, ',passmark,')
        continue-on-error: true
        run: python3 .harness/bin/hw-bench.py passmark --out "$RUNNER_TEMP/bench/metrics.json"
      - name: "memory"
        if: contains(env.BENCH_GROUPS, ',memory,')
        continue-on-error: true
        run: python3 .harness/bin/hw-bench.py memory --out "$RUNNER_TEMP/bench/metrics.json"
      - name: "disk"
        if: contains(env.BENCH_GROUPS, ',disk,')
        continue-on-error: true
        run: python3 .harness/bin/hw-bench.py disk --out "$RUNNER_TEMP/bench/metrics.json"
      - name: "network"
        if: contains(env.BENCH_GROUPS, ',network,')
        continue-on-error: true
        run: python3 .harness/bin/hw-bench.py network --out "$RUNNER_TEMP/bench/metrics.json"
      - name: "docker"
        if: contains(env.BENCH_GROUPS, ',docker,')
        continue-on-error: true
        run: python3 .harness/bin/hw-bench.py docker --out "$RUNNER_TEMP/bench/metrics.json"
      - name: "postgres"
        if: contains(env.BENCH_GROUPS, ',postgres,')
        continue-on-error: true
        run: python3 .harness/bin/hw-bench.py postgres --out "$RUNNER_TEMP/bench/metrics.json"
      - name: Upload
        if: always() && steps.harness.outcome == 'success'
        uses: ./.harness/.github/actions/bench-finish
        with:
          key: ${{ matrix.key }}

  publish:
    needs: [plan, bench]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      # Annotations (check runs) carry the job's error message.
      checks: read
      # GitHub OIDC token for the read-only RunsOn cost role (publish action).
      id-token: write
    concurrency:
      group: publish-results-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # Keeps its credentials: the publish step pushes results.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/publish
        with:
          dispatch-token: ${{ secrets.SITE_DISPATCH_TOKEN }}
          cost-reader-role: ${{ vars.AWS_COST_READER_ROLE_ARN }}
          runs-on-log-group: ${{ vars.RUNS_ON_LOG_GROUP }}
          aws-region: ${{ vars.AWS_REGION }}
