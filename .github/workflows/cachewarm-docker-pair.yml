name: Cold/warm Docker pair (experiment)

# One runner's Docker pair, on the docker suite's PostHog build, pushed to GHCR. Cold: a fresh
# BuildKit builder, no cache-from, layers exported with cache-to type=gha
# (mode=max) under a scope no earlier job used. Warm: a fresh runner and
# builder import that scope and rebuild. type=gha goes wherever the provider
# routes the GitHub cache (RunsOn Magic Cache S3, Blacksmith, Ubicloud; Avrea
# through its documented url_v2), GitHub's cache otherwise.
on:
  workflow_call:
    inputs:
      cold-key: { type: string, required: true }
      warm-key: { type: string, required: true }
      cold-label: { type: string, required: true }
      warm-label: { type: string, required: true }
      provider: { type: string, required: true }
      cache-action: { type: string, required: true }
      cache-key: { type: string, required: true }
      variant: { type: string, required: false, default: "" }

permissions:
  contents: read
  actions: write
  packages: write

env:
  POSTHOG_SHA: ba81ecf8f5bccbaee4ec5a1613780e0acfd7585b
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  CACHE_KEY: ${{ inputs.cache-key }}
  VARIANT: ${{ inputs.variant }}
  # Avrea serves type=gha only when url_v2 points at its cache (its docs).
  GHA_CACHE: type=gha,scope=${{ inputs.cache-key }}${{ inputs.provider == 'Avrea' && ',url_v2=https://cache.avrea.com/' || '' }}
  # One GHCR repository per pair, so no layer is already there from another
  # provider's push; the warm push lands in the cold push's repository (as a
  # real CI pipeline would) and uploads only the layers that changed.
  IMAGE: ghcr.io/${{ github.repository_owner }}/cachewarm-${{ inputs.cache-key }}

jobs:
  cold:
    name: ${{ inputs.cold-key }}
    runs-on: ${{ fromJSON(inputs.cold-label) }}
    timeout-minutes: 90
    env:
      STAGE: cold
      KEY: ${{ inputs.cold-key }}
    steps: &docker-steps
      - id: harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: .harness
          persist-credentials: false
      - name: Host info
        uses: ./.harness/.github/actions/bench-start
      - name: Magic Cache
        if: inputs.provider == 'RunsOn'
        uses: runs-on/action@dfae4d98c5537a0dc7bbb7e6b9211f30ba240f6d # v2.4.0
      - name: Probe transparent caches
        run: bash .harness/bin/cache-probe.sh "$RUNNER_TEMP/bench/probe.json"
      - name: Make room
        run: |
          root=$(docker info -f '{{.DockerRootDir}}' 2>/dev/null || true)
          [ -d "$root" ] || root=/
          free=$(df -BG --output=avail "$root" | tail -1 | tr -dc 0-9)
          echo "free at $root: ${free}G"
          if [ "$free" -lt 40 ]; then
            sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
            df -h "$root"
          fi
      - name: "phase: fetch source"
        run: |
          mkdir posthog && cd posthog
          git init -q
          git remote add origin https://github.com/PostHog/posthog.git
          git fetch -q --depth=1 --no-tags origin "$POSTHOG_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$POSTHOG_SHA"
      - name: "phase: buildx setup"
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: "phase: source change"
        if: env.STAGE == 'warm'
        working-directory: posthog
        run: |
          # A typical commit: one frontend file and one Django file change, so
          # the frontend bundle, collectstatic and the final layers rebuild
          # while dependencies and base layers come from the cache.
          fe=$(git ls-files 'frontend/src/scenes/*.tsx' | sort | head -1)
          py=posthog/settings/__init__.py
          echo "// cachewarm $GITHUB_RUN_ID" >> "$fe"
          echo "# cachewarm $GITHUB_RUN_ID" >> "$py"
          echo "changed: $fe $py"
      - name: Cache settings
        run: |
          if [ "$STAGE" = cold ]; then
            echo "CACHE_FROM=" >> "$GITHUB_ENV"
          else
            echo "CACHE_FROM=$GHA_CACHE" >> "$GITHUB_ENV"
          fi
          echo "TAG=$IMAGE:$STAGE" >> "$GITHUB_ENV"
      - name: Registry login
        if: env.VARIANT == ''
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Provider registry
        # Variant `ecr`: RunsOn's ephemeral ECR registry in the stack's region
        # (RUNS_ON_ECR_CACHE, stack option EnableEphemeralRegistry), one tag per
        # stage. Variant `nscr`: Namespace's registry, nscr.io/<workspace>.
        if: env.VARIANT != ''
        run: |
          set -x
          env | cut -d= -f1 | grep -iE 'nsc|namespace|runs_on|ecr|aws_' | sort || true
          python3 -c "import json,os;d=json.load(open(os.path.expanduser('~/.docker/config.json')));print('auths',list(d.get('auths',{})),'helpers',d.get('credHelpers'),'store',d.get('credsStore'))" 2>/dev/null || echo "no docker config"
          command -v nsc aws || true
          case "$VARIANT" in
            ecr)
              repo="${RUNS_ON_ECR_CACHE:?RUNS_ON_ECR_CACHE not set: stack has no ephemeral registry}"
              host="${repo%%/*}"; region=$(echo "$host" | cut -d. -f4)
              aws ecr get-login-password --region "$region" | docker login "$host" -u AWS --password-stdin
              echo "TAG=$repo:cachewarm-$CACHE_KEY-$STAGE" >> "$GITHUB_ENV" ;;
            nscr)
              nsc docker login || true
              ws=$(nsc workspace describe -o json 2>/dev/null | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('id') or d.get('tenant_id') or d.get('workspace',{}).get('id',''))" || true)
              [ -n "$ws" ] || { echo "::error::no Namespace workspace id"; exit 1; }
              echo "TAG=nscr.io/$ws/cachewarm-$CACHE_KEY:$STAGE" >> "$GITHUB_ENV" ;;
          esac
      - name: "phase: docker build"
        # Build only: the image stays in the builder. Cold imports nothing;
        # warm imports the cold job's cache.
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: posthog
          outputs: type=image,name=${{ env.TAG }},push=false
          provenance: false
          sbom: false
          cache-from: ${{ env.CACHE_FROM }}
      - name: Build record
        if: always()
        run: docker buildx history ls --format json 2>/dev/null | head -1 > "$RUNNER_TEMP/bench/buildx-history.json" || true
      - name: "phase: registry push"
        # Same build, every step already in the builder: this measures the
        # image export and the upload to GHCR.
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: posthog
          outputs: type=image,name=${{ env.TAG }},push=true
          provenance: false
          sbom: false
      - name: "phase: cache export"
        # Same build again, exporting every layer to the provider's GitHub
        # cache backend (mode=max): what a CI job adds to keep the cache warm.
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: posthog
          outputs: type=cacheonly
          provenance: false
          sbom: false
          cache-to: ${{ env.GHA_CACHE }},mode=max
      - name: Image size
        if: always()
        run: |
          docker buildx imagetools inspect "$TAG" --raw 2>/dev/null | python3 -c "import json,sys
          m=json.load(sys.stdin); print('layers', len(m.get('layers',[])), 'MiB', sum(l['size'] for l in m.get('layers',[]))//2**20)" || true
      - name: Check cache use
        if: always()
        run: |
          # BuildKit's own record of the build step: total, cached and completed steps.
          python3 - <<'PY'
          import json, os, sys
          p = os.path.join(os.environ["RUNNER_TEMP"], "bench", "buildx-history.json")
          try:
              h = json.loads(open(p).read().strip() or "{}")
          except Exception:
              h = {}
          # Field names differ across buildx versions.
          pick = lambda *ks: next((h[k] for k in ks if k in h), None)
          rec = {"total": pick("TotalSteps", "NumTotalSteps", "total_steps"),
                 "cached": pick("CachedSteps", "NumCachedSteps", "cached_steps"),
                 "completed": pick("CompletedSteps", "NumCompletedSteps", "completed_steps"),
                 "raw": {k: v for k, v in h.items() if "Step" in k or "step" in k}}
          json.dump(rec, open(os.path.join(os.environ["RUNNER_TEMP"], "bench", "buildkit.json"), "w"))
          print(rec)
          stage, cached = os.environ["STAGE"], rec["cached"]
          if cached is None:
              print("::warning::buildx history has no cached-step count")
          elif stage == "cold" and cached > 0:
              print(f"::error::cold build reused {cached} cached steps"); sys.exit(1)
          elif stage == "warm" and cached == 0:
              print("::error::warm build reused nothing"); sys.exit(1)
          PY
      - name: Metrics
        if: always()
        run: python3 .harness/bin/cachewarm-metrics.py
      - name: Delete cache entries
        if: always() && github.job == 'warm'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # type=gha writes many entries whose keys start with the scope's
          # buildkit prefix; drop every entry of this pair's scope.
          for page in 1 2 3 4 5; do
            keys=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/caches?per_page=100&page=$page" \
              | python3 -c "import json,sys,os;print('\n'.join(c['key'] for c in json.load(sys.stdin).get('actions_caches',[]) if os.environ['CACHE_KEY'] in c['key']))") || break
            [ -n "$keys" ] || break
            while read -r k; do
              curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/caches?key=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$k")" -o /dev/null || true
            done <<< "$keys"
          done
          echo done
      - name: Delete registry package
        if: always() && github.job == 'warm' && env.VARIANT == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/orgs/$GITHUB_REPOSITORY_OWNER/packages/container/cachewarm-$CACHE_KEY" && echo deleted
      - name: Upload
        if: always() && steps.harness.outcome == 'success'
        uses: ./.harness/.github/actions/bench-finish
        with:
          key: ${{ env.KEY }}

  warm:
    needs: cold
    if: needs.cold.result == 'success'
    name: ${{ inputs.warm-key }}
    runs-on: ${{ fromJSON(inputs.warm-label) }}
    timeout-minutes: 90
    env:
      STAGE: warm
      KEY: ${{ inputs.warm-key }}
    steps: *docker-steps
