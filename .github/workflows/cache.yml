    timeout-minutes: 40
    steps: *bench-steps

  bench-w20:
    needs: [plan, bench-w19]
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' && needs.plan.outputs.wave20 != '' }}
    name: ${{ matrix.key }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.wave20) }}
    runs-on: ${{ matrix.label }}
    timeout-minutes: 40
    steps: *bench-steps

  publish:
    needs: [plan, bench, bench-w1, bench-w2, bench-w3, bench-w4, bench-w5, bench-w6, bench-w7, bench-w8, bench-w9, bench-w10, bench-w11, bench-w12, bench-w13, bench-w14, bench-w15, bench-w16, bench-w17, bench-w18, bench-w19, bench-w20]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      # Annotations (check runs) carry the job's error message.
      checks: read
      # GitHub OIDC token for the read-only RunsOn cost role (publish action).
      id-token: write
    concurrency:
      group: publish-results-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # Keeps its credentials: the publish step pushes results.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/publish
        with:
          dispatch-token: ${{ secrets.SITE_DISPATCH_TOKEN }}
          cost-reader-role: ${{ vars.AWS_COST_READER_ROLE_ARN }}
          runs-on-log-group: ${{ vars.RUNS_ON_LOG_GROUP }}
          aws-region: ${{ vars.AWS_REGION }}
