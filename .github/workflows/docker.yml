name: Docker build (PostHog)

on:
  # Staggered so suites never share a provider's concurrency (burst runs alone,
  # mid-week, at a busy hour). Schedules only fire on the default branch.
  schedule:
    - cron: "0 6 1-31/3 * *"
  workflow_dispatch:
    inputs:
      runners:
        description: "default (the suite's runners; also when empty), all, or comma-separated runner ids from config/runners.json"
        required: false
        default: ""
      arch:
        description: "all, x64 or arm64 (empty: all). Trigger files are read on push only"
        required: false
        default: ""
      iterations:
        description: "Runs per runner, at most 5 (empty: 1)"
        required: false
        default: ""
  push:
    branches: [main, harness]
    paths:
      - triggers/docker.json

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    # The first push of a new branch matches every paths filter: never a run.
    if: github.event_name != 'push' || github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.plan.outputs.run }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: plan
        # Inputs go through env, never into the script text.
        env:
          SUITE: docker
          RUNNERS: ${{ inputs.runners }}
          ARCH: ${{ inputs.arch }}
          ITERATIONS: ${{ inputs.iterations }}
          EVENT: ${{ github.event_name }}
          PRIVATE: ${{ github.event.repository.private }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$PRIVATE" ] || PRIVATE=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)
          python3 bin/plan.py --suite "$SUITE" \
            --runners "$RUNNERS" --arch "$ARCH" --iterations "$ITERATIONS" \
            --trigger "triggers/$SUITE.json" --event "$EVENT" \
            --private "$PRIVATE" --out plan.json
      - if: steps.plan.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plan
          path: plan.json

  bench:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    name: ${{ matrix.key }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.label }}
    timeout-minutes: 90
    env:
      POSTHOG_SHA: ba81ecf8f5bccbaee4ec5a1613780e0acfd7585b
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - id: harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: .harness
          persist-credentials: false
      - name: Host info
        uses: ./.harness/.github/actions/bench-start
      - name: "Experiment: zram"
        if: contains(matrix.key, '-zram-')
        run: |
          # Same setup as the RunsOn agent on <=16 GiB runners: zram0 sized to
          # RAM, default algorithm, priority 100, swappiness 100, page-cluster 0.
          mem=$(awk '/MemTotal/ {print $2 * 1024}' /proc/meminfo)
          sudo modprobe zram
          echo "algorithm: $(cat /sys/block/zram0/comp_algorithm)"
          echo "$mem" | sudo tee /sys/block/zram0/disksize >/dev/null
          sudo mkswap /dev/zram0 >/dev/null && sudo swapon -p 100 /dev/zram0
          sudo sysctl -q vm.swappiness=100 vm.page-cluster=0
          # zram does not raise tmpfs's size cap (RAM): lift it to 1.5x RAM so
          # the cap is not what stops the build.
          sudo mount -o remount,size=$((mem * 3 / 2)) /var/lib/docker
          df -h /var/lib/docker; swapon --show; free -g
          # Sample memory every 10 s for the whole job.
          cat > /tmp/sampler.sh <<'SH'
          while sleep 10; do
            read -r orig compr _ < /sys/block/zram0/mm_stat
            used=$(free -m | awk '/Mem/ {print $3}')
            swap=$(free -m | awk '/Swap/ {print $3}')
            docker=$(df -BM --output=used /var/lib/docker | tail -1 | tr -d ' ')
            echo "$(date +%T) used=${used}M swap=${swap}M zram=$((orig >> 20))M->$((compr >> 20))M docker=${docker}"
          done
          SH
          nohup bash /tmp/sampler.sh > /tmp/mem-samples.log 2>&1 &
      - name: Make room
        run: |
          # The PostHog build needs ~40 GB. Runners with less free space at
          # the Docker root get the usual cleanup; it is not timed.
          root=$(docker info -f '{{.DockerRootDir}}' 2>/dev/null || true)
          [ -d "$root" ] || root=/
          free=$(df -BG --output=avail "$root" | tail -1 | tr -dc 0-9)
          echo "free at $root: ${free}G"
          if [ "$free" -lt 40 ]; then
            sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
            df -h "$root"
          fi
      - name: "phase: fetch source"
        # PostHog at the pinned commit only: depth 1, no tags, no history.
        # Timed on its own (a network phase), so "docker build" measures the
        # build. BuildKit's git context used to fetch the full history and
        # every tag, which took 80-460 s depending on the runner's network.
        run: |
          mkdir posthog && cd posthog
          git init -q
          git remote add origin https://github.com/PostHog/posthog.git
          git fetch -q --depth=1 --no-tags origin "$POSTHOG_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$POSTHOG_SHA"
      - name: "phase: buildx setup"
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: "phase: docker build"
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          # Local context: PostHog's .dockerignore starts with "*", so .git
          # never enters the build either way.
          context: posthog
          outputs: type=cacheonly
          provenance: false
          sbom: false
      - name: Disk after build
        if: always()
        continue-on-error: true
        run: df -h "$(docker info -f '{{.DockerRootDir}}')" || df -h
      - name: "Experiment: memory report"
        if: always() && contains(matrix.key, '-zram-')
        continue-on-error: true
        run: |
          free -g; swapon --show; sudo zramctl
          cat /proc/pressure/memory
          grep oom_kill /proc/vmstat
          echo "--- samples"; cat /tmp/mem-samples.log
      - name: Upload
        if: always() && steps.harness.outcome == 'success'
        uses: ./.harness/.github/actions/bench-finish
        with:
          key: ${{ matrix.key }}

  publish:
    needs: [plan, bench]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      # Annotations (check runs) carry the job's error message.
      checks: read
      # GitHub OIDC token for the read-only RunsOn cost role (publish action).
      id-token: write
    concurrency:
      group: publish-results-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # Keeps its credentials: the publish step pushes results.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/publish
        with:
          cost-reader-role: ${{ vars.AWS_COST_READER_ROLE_ARN }}
          runs-on-log-group: ${{ vars.RUNS_ON_LOG_GROUP }}
          aws-region: ${{ vars.AWS_REGION }}
