name: Check harness

# Lightweight checks on GitHub-hosted ubuntu, no benchmark runner: trigger
# files only name runners that exist, plan.py and collect.py behave.
on:
  push:
    branches: [main, harness]
    paths:
      - triggers/**
      - config/**
      - bin/**
      - tests/**
      - .github/**
  # Runs on GitHub-hosted ubuntu only: safe to start by hand.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Trigger files
        run: python3 bin/check-triggers.py
      - name: Self-checks
        run: python3 -m unittest discover -s tests -v
