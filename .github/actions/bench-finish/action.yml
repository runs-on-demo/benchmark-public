name: Bench finish
description: Upload host facts and metrics for the publish job.
inputs:
  key:
    description: Matrix key of this job
    required: true
runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: bench-${{ inputs.key }}
        path: ${{ runner.temp }}/bench/
        if-no-files-found: ignore
        retention-days: 14
